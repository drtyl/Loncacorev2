<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saat ve alarm</title>
<style>
/*ORTAK*/
#saat { font-size: 64px; font-weight: 300; letter-spacing: 2px; text-align: center; font-variant-numeric: tabular-nums; margin: 6px 0 0; }
#tarih { text-align: center; color: #a9a1d6; margin-bottom: 14px; }
.alarm { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid #241f40; }
.alarm:last-child { border-bottom: 0; }
.alarm .vakit { font-size: 30px; font-variant-numeric: tabular-nums; }
.alarm.kapali .vakit, .alarm.kapali .ad { color: #6f6894; }
.alarm .ad { font-size: 14px; } .alarm .gun { font-size: 12px; color: #8f87b8; }
.anahtar { position: relative; width: 46px; height: 26px; border-radius: 13px; background: #2e2752; border: 0; }
.anahtar::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #8f87b8; transition: .2s; }
.anahtar.acik { background: #6a4bd6; } .anahtar.acik::after { left: 23px; background: #fff; }
.gunler { display: flex; gap: 4px; margin-top: 8px; }
.gunler button { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid #2e2752; background: #1e1a38; color: #a9a1d6; font-size: 12px; }
.gunler button.secili { background: #3a2a66; border-color: #a77de8; color: #fff; }
#sure { font-size: 48px; text-align: center; font-variant-numeric: tabular-nums; margin: 8px 0; }
.not { color: #8f87b8; font-size: 12px; line-height: 1.5; margin: 8px 2px 0; }
</style>
</head>
<body>
<div id="saat">--:--</div>
<div id="tarih"></div>
<div class="sekmeler" id="sekme"><button data-s="alarm" class="aktif">Alarmlar</button><button data-s="sayac">Zamanlayıcı</button><button data-s="krono">Kronometre</button></div>

<section id="s-alarm">
  <div class="kart">
    <div class="satir"><input type="time" id="vakit" value="07:30" style="max-width:130px"><input id="ad" placeholder="Etiket (Uyan, İlaç…)" maxlength="40"></div>
    <div class="gunler" id="gunSec"></div>
    <div class="satir" style="margin-top:8px"><span class="not" style="margin:0">Gün seçmezsen bir kez çalar.</span><button class="btn vurgu" id="ekle">Alarm kur</button></div>
  </div>
  <div class="kart" id="liste"></div>
  <p class="not">Alarm uygulama açıkken çalar ve evdeki karakter seni sesli uyarır. Telefon kilitliyken çalması için ilerideki bir güncelleme gerekiyor.</p>
</section>

<section id="s-sayac" class="gizli">
  <div class="kart">
    <div class="satir"><input type="number" id="dk" min="0" max="600" value="5" aria-label="Dakika"><input type="number" id="sn" min="0" max="59" value="0" aria-label="Saniye"></div>
    <div id="sure">05:00</div>
    <div class="satir"><button class="btn vurgu" id="sBas">Başlat</button><button class="btn" id="sDur">Durdur</button><button class="btn" id="sSifir">Sıfırla</button></div>
  </div>
</section>

<section id="s-krono" class="gizli">
  <div class="kart">
    <div id="krono" style="font-size:48px;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0">00:00.0</div>
    <div class="satir"><button class="btn vurgu" id="kBas">Başlat</button><button class="btn" id="kSifir">Sıfırla</button></div>
  </div>
</section>
<script>
var GUN = [['Pzt', 1], ['Sal', 2], ['Çar', 3], ['Per', 4], ['Cum', 5], ['Cmt', 6], ['Paz', 0]];
var alarmlar = [], secGun = [];
var iki = function (n) { return (n < 10 ? '0' : '') + n; };
function el(t, c, m) { var e = document.createElement(t); if (c) e.className = c; if (m !== undefined) e.textContent = m; return e; }
function saatCiz() { var d = new Date(); document.getElementById('saat').textContent = iki(d.getHours()) + ':' + iki(d.getMinutes()); document.getElementById('tarih').textContent = d.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
setInterval(saatCiz, 1000); saatCiz();
var gs = document.getElementById('gunSec');
GUN.forEach(function (g) { var b = el('button', '', g[0]); b.onclick = function () { var i = secGun.indexOf(g[1]); if (i < 0) secGun.push(g[1]); else secGun.splice(i, 1); b.classList.toggle('secili', i < 0); }; gs.appendChild(b); });
function gunYazi(a) { if (!a.gunler || !a.gunler.length) return 'Bir kez'; if (a.gunler.length === 7) return 'Her gün'; return GUN.filter(function (g) { return a.gunler.indexOf(g[1]) >= 0; }).map(function (g) { return g[0]; }).join(' '); }
function kaydet() { Lonca.kaydet('alarmlar', alarmlar); ciz(); }
function ciz() {
  var l = document.getElementById('liste'); l.innerHTML = '';
  if (!alarmlar.length) { l.appendChild(el('div', 'bos', 'Kurulu alarm yok.')); return; }
  alarmlar.slice().sort(function (a, b) { return a.saat < b.saat ? -1 : 1; }).forEach(function (a) {
    var d = el('div', 'alarm' + (a.acik ? '' : ' kapali'));
    d.appendChild(el('div', 'vakit', a.saat));
    var orta = el('div'); orta.appendChild(el('div', 'ad', a.ad || 'Alarm')); orta.appendChild(el('div', 'gun', gunYazi(a))); d.appendChild(orta);
    var an = el('button', 'anahtar' + (a.acik ? ' acik' : '')); an.setAttribute('aria-label', 'Aç / kapat'); an.onclick = function () { a.acik = !a.acik; kaydet(); };
    d.appendChild(an);
    var sil = el('button', 'btn kucuk tehlike', 'Sil'); sil.style.gridColumn = '1 / -1'; sil.style.justifySelf = 'start'; sil.onclick = function () { alarmlar = alarmlar.filter(function (x) { return x !== a; }); kaydet(); };
    d.appendChild(sil); l.appendChild(d);
  });
}
document.getElementById('ekle').onclick = function () {
  var v = document.getElementById('vakit').value; if (!/^\d\d:\d\d$/.test(v)) return;
  alarmlar.push({ id: Date.now().toString(36), saat: v, ad: document.getElementById('ad').value.trim(), gunler: secGun.slice(), acik: true });
  document.getElementById('ad').value = ''; secGun = []; [].forEach.call(gs.children, function (b) { b.classList.remove('secili'); });
  kaydet(); Lonca.olay('alarmKuruldu', { saat: v }); Lonca.soyle('Alarm ' + v + ' için kuruldu.');
};
// zamanlayıcı
var kalan = 0, sayacZ = null, son = 0;
function sureYaz() { var t = Math.max(0, Math.ceil(kalan)); document.getElementById('sure').textContent = iki(Math.floor(t / 60)) + ':' + iki(t % 60); }
function hedefAl() { return (+document.getElementById('dk').value || 0) * 60 + (+document.getElementById('sn').value || 0); }
['dk', 'sn'].forEach(function (i) { document.getElementById(i).oninput = function () { if (!sayacZ) { kalan = hedefAl(); sureYaz(); } }; });
function bip() { try { var a = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(function (t) { var o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .2; o.connect(g); g.connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .2); }); } catch (e) {} }
document.getElementById('sBas').onclick = function () {
  if (sayacZ) return; if (kalan <= 0) kalan = hedefAl(); if (kalan <= 0) return; son = Date.now();
  sayacZ = setInterval(function () { var n = Date.now(); kalan -= (n - son) / 1000; son = n; sureYaz(); if (kalan <= 0) { clearInterval(sayacZ); sayacZ = null; bip(); Lonca.soyle('Süre doldu!'); Lonca.olay('sureDoldu', {}); } }, 200);
};
document.getElementById('sDur').onclick = function () { clearInterval(sayacZ); sayacZ = null; };
document.getElementById('sSifir').onclick = function () { clearInterval(sayacZ); sayacZ = null; kalan = hedefAl(); sureYaz(); };
kalan = hedefAl(); sureYaz();
// kronometre
var kz = null, kBas = 0, kTop = 0;
function kYaz() { var t = kTop + (kz ? Date.now() - kBas : 0); document.getElementById('krono').textContent = iki(Math.floor(t / 60000)) + ':' + iki(Math.floor(t / 1000) % 60) + '.' + Math.floor(t / 100) % 10; }
document.getElementById('kBas').onclick = function () { if (kz) { clearInterval(kz); kz = null; kTop += Date.now() - kBas; this.textContent = 'Devam'; } else { kBas = Date.now(); kz = setInterval(kYaz, 100); this.textContent = 'Durdur'; } kYaz(); };
document.getElementById('kSifir').onclick = function () { clearInterval(kz); kz = null; kTop = 0; document.getElementById('kBas').textContent = 'Başlat'; kYaz(); };
document.getElementById('sekme').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return;
  [].forEach.call(this.children, function (x) { x.classList.toggle('aktif', x === b); });
  ['alarm', 'sayac', 'krono'].forEach(function (s) { document.getElementById('s-' + s).classList.toggle('gizli', b.dataset.s !== s); });
};
Lonca.oku('alarmlar').then(function (v) { alarmlar = v || []; ciz(); });
</script>
</body>
</html>
