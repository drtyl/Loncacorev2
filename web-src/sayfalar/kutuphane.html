<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kütüphane</title>
<style>
/*ORTAK*/
.kitap { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 2px; border-bottom: 1px solid #241f40; }
.kitap:last-child { border-bottom: 0; }
.kitap b { font-size: 16px; }
.kitap .yazar { color: #9c94c8; font-size: 13px; }
.kitap .not { grid-column: 1 / -1; color: #bdb5e6; font-size: 13px; white-space: pre-wrap; }
.kitap .islem { grid-column: 1 / -1; display: flex; gap: 6px; }
.durum-okunuyor { border-color: #a77de8; color: #fff; background: #3a2a66; }
.durum-bitti { border-color: #2f7a5a; color: #b8f0d4; background: #183a2c; }
</style>
</head>
<body>
<h1>Kütüphane <small id="sayi"></small></h1>
<div class="kart">
  <input id="ad" placeholder="Kitap adı" maxlength="80">
  <div class="satir" style="margin-top:8px">
    <input id="yazar" placeholder="Yazar (isteğe bağlı)" maxlength="60">
    <select id="durum" style="max-width:130px"><option value="okunacak">Okunacak</option><option value="okunuyor">Okunuyor</option><option value="bitti">Bitti</option></select>
  </div>
  <div class="satir" style="margin-top:8px"><span></span><button class="btn vurgu" id="ekle">Rafa koy</button></div>
</div>
<div class="sekmeler" id="filtre">
  <button data-f="hepsi" class="aktif">Hepsi</button><button data-f="okunuyor">Okunuyor</button><button data-f="okunacak">Okunacak</button><button data-f="bitti">Bitti</button>
</div>
<div class="kart" id="liste"></div>
<script>
var kitaplar = [], filtre = 'hepsi';
var AD = { okunacak: 'Okunacak', okunuyor: 'Okunuyor', bitti: 'Bitti' }, SIRA = ['okunacak', 'okunuyor', 'bitti'];
function kaydet() { Lonca.kaydet('kitaplar', kitaplar); ciz(); }
function el(t, c, m) { var e = document.createElement(t); if (c) e.className = c; if (m !== undefined) e.textContent = m; return e; }
function ciz() {
  var l = document.getElementById('liste'); l.innerHTML = '';
  var g = kitaplar.filter(function (k) { return filtre === 'hepsi' || k.durum === filtre; });
  document.getElementById('sayi').textContent = kitaplar.length ? kitaplar.length + ' kitap' : '';
  if (!g.length) { l.appendChild(el('div', 'bos', kitaplar.length ? 'Bu rafta kitap yok.' : 'Raf boş. İlk kitabını ekle; karakterler buraya bakar.')); return; }
  g.forEach(function (k) {
    var d = el('div', 'kitap');
    var sol = el('div'); sol.appendChild(el('b', '', k.ad)); if (k.yazar) { sol.appendChild(el('br')); sol.appendChild(el('span', 'yazar', k.yazar)); }
    var cip = el('button', 'cip durum-' + k.durum, AD[k.durum]);
    cip.onclick = function () { k.durum = SIRA[(SIRA.indexOf(k.durum) + 1) % 3]; if (k.durum === 'bitti') Lonca.olay('kitapBitti', { ad: k.ad }); kaydet(); };
    d.appendChild(sol); d.appendChild(cip);
    if (k.not) d.appendChild(el('div', 'not', k.not));
    var is = el('div', 'islem');
    var nb = el('button', 'btn kucuk', k.not ? 'Notu düzenle' : 'Not ekle');
    nb.onclick = function () { var t = prompt('Not', k.not || ''); if (t !== null) { k.not = t.trim().slice(0, 600); kaydet(); } };
    var sb = el('button', 'btn kucuk tehlike', 'Kaldır');
    sb.onclick = function () { if (confirm('"' + k.ad + '" raftan kaldırılsın mı?')) { kitaplar = kitaplar.filter(function (x) { return x !== k; }); kaydet(); } };
    is.appendChild(nb); is.appendChild(sb); d.appendChild(is);
    l.appendChild(d);
  });
}
document.getElementById('ekle').onclick = function () {
  var ad = document.getElementById('ad').value.trim(); if (!ad) return;
  var k = { id: Date.now().toString(36), ad: ad, yazar: document.getElementById('yazar').value.trim(), durum: document.getElementById('durum').value, not: '', z: Date.now() };
  kitaplar.unshift(k); document.getElementById('ad').value = ''; document.getElementById('yazar').value = '';
  kaydet(); Lonca.olay('kitap', { ad: k.ad, durum: k.durum }); Lonca.soyle('Rafa koydum: ' + k.ad);
};
document.getElementById('filtre').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return; filtre = b.dataset.f;
  [].forEach.call(this.children, function (x) { x.classList.toggle('aktif', x === b); }); ciz();
};
Lonca.oku('kitaplar').then(function (v) { kitaplar = v || []; ciz(); });
</script>
</body>
</html>
